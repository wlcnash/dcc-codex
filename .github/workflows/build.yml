name: Build and push images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ghcr.io/wlcnash/dcc-codex
  IMAGE_SEEDER: ghcr.io/wlcnash/dcc-codex-seeder

jobs:
  build:
    runs-on: self-hosted  # uses your homelab GitHub Actions runner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (app)
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_APP }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,suffix=,format=short

      - name: Extract metadata (seeder)
        id: meta-seeder
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SEEDER }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=,suffix=,format=short

      - name: Build and push app image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push seeder image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.seeder
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-seeder.outputs.tags }}
          labels: ${{ steps.meta-seeder.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
