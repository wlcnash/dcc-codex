apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dcc-codex-secrets
  namespace: dcc-codex
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden
    kind: ClusterSecretStore
  target:
    name: dcc-codex-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: dcc-codex-postgres-password
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: dcc-codex-gemini-api-key
    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: dcc-codex-minio-access-key
    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: dcc-codex-minio-secret-key
