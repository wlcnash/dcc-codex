apiVersion: v1
kind: ServiceAccount
metadata:
  name: dcc-codex
  namespace: dcc-codex
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dcc-codex-updater
  namespace: dcc-codex
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dcc-codex-updater
  namespace: dcc-codex
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dcc-codex-updater
subjects:
  - kind: ServiceAccount
    name: dcc-codex
    namespace: dcc-codex
