apiVersion: v1
kind: Service
metadata:
  name: dcc-codex
  namespace: dcc-codex
spec:
  selector:
    app: dcc-codex
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: dcc-codex
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
