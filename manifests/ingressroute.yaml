apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: dcc-codex
  namespace: dcc-codex
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dcc-codex.home`)
      kind: Rule
      middlewares:
        - name: authentik-forwardauth
          namespace: authentik
      services:
        - name: dcc-codex
          port: 8000
  tls:
    secretName: dcc-codex-tls
