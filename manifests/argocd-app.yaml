apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dcc-codex
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wlcnash/homelab
    targetRevision: HEAD
    path: manifests/dcc-codex
  destination:
    server: https://kubernetes.default.svc
    namespace: dcc-codex
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
